name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The test suite fakes Layer 1, so it needs no audio stack (PortAudio) and
      # no API key — just websockets (imported by the Grok provider) and pytest.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install websockets pytest
      - name: Run tests
        run: pytest
